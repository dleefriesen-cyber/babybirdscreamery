<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">

  <!-- Circle background -->
  <circle cx="60" cy="60" r="55" fill="#F2EDE4"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#C9A84C" stroke-width="4.5"/>

  <!-- Branch -->
  <path d="M12 90 Q38 84 70 76" stroke="#8B7035" stroke-width="3.8" stroke-linecap="round" fill="none"/>

  <!-- Leaves hanging off branch -->
  <ellipse cx="22" cy="91" rx="6.5" ry="2.5" fill="#2B6358" transform="rotate(-22 22 91)"/>
  <ellipse cx="32" cy="89" rx="6" ry="2.3" fill="#2B6358" transform="rotate(-16 32 89)"/>
  <ellipse cx="43" cy="87" rx="5.5" ry="2.2" fill="#2B6358" transform="rotate(-10 43 87)"/>
  <ellipse cx="62" cy="82" rx="5.5" ry="2.2" fill="#2B6358" transform="rotate(-4 62 82)"/>
  <ellipse cx="73" cy="79" rx="5" ry="2" fill="#2B6358" transform="rotate(8 73 79)"/>
  <ellipse cx="82" cy="77" rx="5" ry="2" fill="#2B6358" transform="rotate(14 82 77)"/>

  <!-- Tail (long, elegant, sweeping left-down) -->
  <path d="M33 67 Q20 76 14 90 Q23 84 36 76 Z" fill="#2B6358"/>
  <path d="M33 67 Q19 79 15 93 Q25 86 37 79 Z" fill="#2B6358" opacity="0.55"/>

  <!-- Body base (salmon/coral) -->
  <ellipse cx="50" cy="65" rx="21" ry="13" fill="#E07860" transform="rotate(-8 50 65)"/>

  <!-- Wing + back (dark teal) covers upper body -->
  <path d="M28 61 Q48 47 70 57 Q67 69 48 73 Q35 72 28 63 Z" fill="#2B6358"/>

  <!-- Wing feather detail lines -->
  <path d="M34 63 Q50 55 67 62" stroke="#F2EDE4" stroke-width="1" fill="none" opacity="0.45"/>
  <path d="M35 68 Q51 60 66 66" stroke="#F2EDE4" stroke-width="1" fill="none" opacity="0.35"/>
  <path d="M36 72 Q50 64 64 69" stroke="#F2EDE4" stroke-width="1" fill="none" opacity="0.22"/>

  <!-- Belly (cream/peach) -->
  <ellipse cx="50" cy="71" rx="10.5" ry="6.5" fill="#F2D8B8" transform="rotate(-8 50 71)"/>

  <!-- Head (salmon base) -->
  <circle cx="63" cy="53" r="12.5" fill="#E07860"/>

  <!-- Dark teal cap on head -->
  <path d="M51 49 Q63 39 75 49 Q75 53 63 54 Q51 54 51 49 Z" fill="#2B6358"/>

  <!-- Teal neck join connecting to wing -->
  <path d="M51 53 Q53 60 57 64 Q49 66 44 61 Q44 55 51 53 Z" fill="#2B6358"/>

  <!-- Eye -->
  <circle cx="68" cy="51" r="3" fill="#1A2820"/>
  <circle cx="69" cy="50.1" r="1" fill="white"/>

  <!-- Beak -->
  <path d="M74 55.5 L86 52 L74 58.5 Z" fill="#8B7035"/>

  <!-- Popsicle held in beak -->
  <g transform="rotate(-22 86 47)">
    <!-- Popsicle body -->
    <rect x="82" y="33" width="12" height="22" rx="3" fill="#E07860"/>
    <!-- Groove lines on popsicle -->
    <line x1="86.5" y1="37" x2="86.5" y2="52" stroke="#C06050" stroke-width="1.3" opacity="0.35"/>
    <line x1="90.5" y1="37" x2="90.5" y2="52" stroke="#C06050" stroke-width="1.3" opacity="0.35"/>
    <!-- Popsicle stick -->
    <rect x="85.5" y="54" width="4.5" height="12" rx="1.8" fill="#C9A84C"/>
  </g>

  <!-- Feet/talons gripping branch -->
  <path d="M43 78 L39 87 M43 78 L43 87 M43 78 L47 86" stroke="#8B7035" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 75 L50 84 M54 75 L54 84 M54 75 L58 83" stroke="#8B7035" stroke-width="2" stroke-linecap="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Circle background -->
  <circle cx="16" cy="16" r="15" fill="#F2EDE4"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Branch -->
  <path d="M4 24 Q12 22 22 20" stroke="#8B7035" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Leaf -->
  <ellipse cx="8" cy="24" rx="2.5" ry="1" fill="#2B6358" transform="rotate(-18 8 24)"/>
  <ellipse cx="19" cy="21" rx="2" ry="0.9" fill="#2B6358" transform="rotate(8 19 21)"/>
  <!-- Tail -->
  <path d="M9 18 Q5 21 4 26 Q8 23 11 21 Z" fill="#2B6358"/>
  <!-- Body -->
  <ellipse cx="14" cy="18" rx="6" ry="3.8" fill="#E07860" transform="rotate(-8 14 18)"/>
  <!-- Wing -->
  <path d="M8 17 Q14 13 20 16 Q19 20 14 21 Q10 20 8 17 Z" fill="#2B6358"/>
  <!-- Belly -->
  <ellipse cx="14" cy="20" rx="3" ry="2" fill="#F2D8B8" transform="rotate(-8 14 20)"/>
  <!-- Head -->
  <circle cx="18" cy="15" r="4" fill="#E07860"/>
  <path d="M14 13.5 Q18 10.5 22 13.5 Q22 15 18 15.2 Q14 15.2 14 13.5 Z" fill="#2B6358"/>
  <!-- Eye -->
  <circle cx="20" cy="14" r="1.1" fill="#1A2820"/>
  <circle cx="20.4" cy="13.6" r="0.35" fill="white"/>
  <!-- Beak -->
  <path d="M21.5 15.5 L25 14.5 L21.5 16.5 Z" fill="#8B7035"/>
  <!-- Popsicle -->
  <g transform="rotate(-20 25 13)">
    <rect x="23" y="9" width="4" height="7" rx="1" fill="#E07860"/>
    <line x1="25" y1="10.5" x2="25" y2="15" stroke="#C06050" stroke-width="0.5" opacity="0.4"/>
    <rect x="24" y="15.5" width="2" height="3.5" rx="0.7" fill="#C9A84C"/>
  </g>
  <!-- Feet -->
  <path d="M12 22 L10 27 M12 22 L12 27 M12 22 L14 26.5" stroke="#8B7035" stroke-width="0.9" stroke-linecap="round"/>
</svg>
